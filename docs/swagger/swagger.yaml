host: localhost:3000
info:
  contact:
    name: Tim Backend Ujian
  description: API untuk sistem ujian online (bank soal, jadwal, pengerjaan ujian
    per section, penilaian).
  title: Ujian Backend API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login untuk user (admin/guru) maupun peserta (siswa) menggunakan
        username & password yang sama. Sistem otomatis mendeteksi apakah username
        adalah user internal atau peserta (peserta divalidasi ke API sekolah eksternal).
      parameters:
      - description: Kredensial login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successfully, berisi JWT token
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "401":
          description: Username tidak ditemukan atau password salah
          schema:
            $ref: '#/definitions/helpers.Response'
      summary: Login
      tags:
      - Auth
  /auth/me:
    get:
      description: Mengambil data user/peserta yang sedang login berdasarkan JWT token
        yang dikirim.
      produces:
      - application/json
      responses:
        "200":
          description: Get current user successfully
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CurrentUserResponse'
              type: object
        "401":
          description: Token tidak valid
          schema:
            $ref: '#/definitions/helpers.Response'
        "404":
          description: User/peserta tidak ditemukan
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Info user yang sedang login
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan akun user (admin/guru) baru. Untuk akun peserta/siswa,
        gunakan proses import peserta, bukan endpoint ini.
      parameters:
      - description: Data registrasi
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Register successfully
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "400":
          description: Validasi gagal atau email/username sudah terdaftar
          schema:
            $ref: '#/definitions/helpers.Response'
      summary: Register user baru
      tags:
      - Auth
  /bank-soal:
    get:
      parameters:
      - default: 1
        description: Halaman
        in: query
        name: page
        type: integer
      - default: 10
        description: Jumlah per halaman
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Get all bank soal successfully
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.BankSoalListResponse'
              type: object
        "500":
          description: Gagal mengambil data
          schema:
            $ref: '#/definitions/helpers.Response'
      summary: List bank soal
      tags:
      - BankSoal
    post:
      consumes:
      - application/json
      description: Bank soal adalah kumpulan/paket soal untuk satu mata pelajaran,
        yang nantinya dipakai oleh satu atau lebih jadwal ujian.
      parameters:
      - description: Data bank soal
        in: body
        name: request
        required: true
        schema:
