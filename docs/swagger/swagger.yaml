  /nilai/{id}/next-section:
    post:
      description: Memindahkan frontier section peserta ke section berikutnya, hanya
        jika waktu minimal (durasi_menit_minimal) pada section saat ini sudah terlampaui.
        Jika belum, response tetap 200 namun boleh_lanjut=false beserta sisa_detik
        yang harus ditunggu — frontend bisa poll endpoint ini atau /section-status
        untuk menampilkan countdown. Section yang sudah pernah dibuka tetap bisa diakses
        bebas (navigasi mundur), endpoint ini hanya menggerakkan batas terjauh (frontier).
      parameters:
      - description: ID nilai (uuid), yaitu ID sesi pengerjaan ujian milik peserta
          yang login
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil maju ke section berikutnya, atau ditolak sementara
            (lihat boleh_lanjut & sisa_detik)
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.SectionProgressResponse'
              type: object
        "400":
          description: Ujian tidak memakai section, sudah selesai, atau sudah di section
            terakhir
          schema:
            $ref: '#/definitions/helpers.Response'
        "401":
          description: Token tidak valid atau bukan pemilik sesi ini
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Maju ke section berikutnya
      tags:
      - Nilai
  /nilai/{id}/restore:
    patch:
      parameters:
      - description: ID nilai (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Restore nilai successfully
          schema:
            $ref: '#/definitions/helpers.Response'
        "400":
          description: Gagal restore
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Restore data nilai yang sudah dihapus
