  /nilai/mulai-ujian/{id_jadwal}:
    post:
      consumes:
      - application/json
      description: Dipanggil peserta saat membuka jadwal ujian. Jika belum pernah
        mulai, sesi nilai baru dibuat beserta seluruh baris jawaban kosong (soal diacak
        jika acak_soal aktif) dan status 201 dikembalikan. Jika sesi sudah ada dan
        belum wkt_selesai, dianggap resume dan status 200 dikembalikan (token tidak
        perlu dikirim ulang saat resume). Jika sudah wkt_selesai, request ditolak.
        Body token bersifat opsional secara umum — hanya wajib diisi jika jadwal ini
        mengaktifkan wajib_token; ambil kode yang berlaku lewat GET /ujian-token/current.
      parameters:
      - description: ID jadwal (uuid)
        in: path
        name: id_jadwal
        required: true
        type: string
      - description: Token ujian (wajib hanya jika jadwal.wajib_token aktif)
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.MulaiUjianRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Lanjutkan ujian successfully (resume sesi yang sudah ada)
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.NilaiResponse'
              type: object
        "201":
          description: Mulai ujian successfully (sesi baru)
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.NilaiResponse'
              type: object
        "400":
          description: Jadwal tidak ditemukan, ujian sudah pernah selesai dikerjakan,
            atau token ujian tidak valid/kedaluwarsa
          schema:
            $ref: '#/definitions/helpers.Response'
        "401":
          description: Token JWT tidak valid
          schema:
