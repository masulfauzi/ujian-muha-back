          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Cek status section aktif (read-only, untuk polling countdown)
      tags:
      - Nilai
  /nilai/analisis/{id_jadwal}:
    get:
      description: 'Menghasilkan ZIP berisi satu .xlsx per kelas: baris = peserta,
        kolom = soal (diurutkan berdasarkan no_soal, konsisten walau acak_soal aktif).
        Cell berisi huruf jawaban peserta, diwarnai hijau (benar), merah (salah),
        atau kuning (belum dijawab) — cell kosong tanpa warna berarti peserta belum
        pernah mulai ujian ini. Baris paling bawah menunjukkan jumlah peserta yang
        benar per soal, untuk melihat soal mana yang paling banyak dijawab salah.'
      parameters:
      - description: ID jadwal (uuid)
        in: path
        name: id_jadwal
        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: File ZIP berisi analisis jawaban per kelas
          schema:
            type: file
        "400":
          description: Jadwal tidak ditemukan, belum memiliki soal, atau tidak ada
            kelas terdaftar
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Export analisis jawaban per soal ke Excel (per kelas, dalam ZIP)
      tags:
      - Nilai
  /nilai/export/{id_jadwal}:
    get:
      description: Menghasilkan file ZIP berisi satu file .xlsx per kelas yang terdaftar
        pada jadwal tersebut.
      parameters:
      - description: ID jadwal (uuid)
        in: path
        name: id_jadwal
        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: File ZIP berisi export nilai per kelas
          schema:
            type: file
        "400":
          description: Jadwal tidak ditemukan atau tidak ada kelas terdaftar
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Export nilai satu jadwal ke Excel (per kelas, dalam ZIP)
      tags:
      - Nilai
  /nilai/jadwal/{id_jadwal}:
    get:
      parameters:
      - description: ID jadwal (uuid)
        in: path
        name: id_jadwal
        required: true
        type: string
      - default: 1
        description: Halaman
        in: query
        name: page
        type: integer
      - default: 10
